name: Familiar Bus Wave 2 validation

on:
  push:
    branches: [feature/familiar-bus-wave-2]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PWA and Edge contracts
        run: |
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool provider-contract.json >/dev/null
          python3 -m json.tool runtime-config.json >/dev/null
          node --check app.js
          node --check db.js
          node --check sw.js
          node --check edge/src/index.mjs
          node --test edge/test/*.test.mjs
          git diff --check origin/main...HEAD
